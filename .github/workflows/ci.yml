name: GreenPulse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Software tests never need to hydrate production raster pointers.
  GIT_LFS_SKIP_SMUDGE: "1"

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          lfs: false
          persist-credentials: false
      - name: Check whitespace
        shell: bash
        run: |
          git diff --check
          # On PRs HEAD is the test merge: first parent is the target branch.
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git show --format= --check HEAD
          fi

  python-tests:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
    steps:
      - name: Check out source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install test dependencies
        run: |
          python -m pip install -r backend/requirements-shap.txt -r backend/requirements-optimizer.txt -r backend/requirements-test.txt
          python -m pip check
      - name: Source audit tests
        run: >-
          python -m pytest -q
          tests/test_landsat_source_audit.py
          tests/test_landsat_processing_audit.py
          tests/test_landsat_extreme_audit.py
          tests/test_sentinel_source_audit.py
      - name: Remaining Python tests
        run: >-
          python -m pytest tests -q
          --ignore=tests/test_landsat_source_audit.py
          --ignore=tests/test_landsat_processing_audit.py
          --ignore=tests/test_landsat_extreme_audit.py
          --ignore=tests/test_sentinel_source_audit.py
      # Runtime production preflight is intentionally omitted: LFS pointers are
      # not raster data. Synthetic tests exercise its failure and publication gates.
      - name: Verify tracked files are unchanged
        if: always()
        run: |
          git diff --check
          git diff --exit-code HEAD

  frontend:
    name: Frontend tests & build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend tests
        run: npm test
      - name: Frontend production build
        run: npm run build
      - name: Verify tracked files are unchanged
        if: always()
        run: |
          git diff --check
          git diff --exit-code HEAD
